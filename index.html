<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151B20" />
    <meta name="description" content="COAL DRISHTI: AI-Powered Smart Governance & Monitoring for Coal Mines. From Mine Data to Verified Action." />
    <meta name="application-name" content="COAL DRISHTI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="COAL DRISHTI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>COAL DRISHTI | Smart Governance &amp; Monitoring for Coal Mines</title>
    <style>
      /* Loading screen, replaced as soon as the app mounts */
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0f1418; color: #fff; font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; }
      #splash .name { font-size: 30px; font-weight: 600; letter-spacing: .08em; }
      #splash .sub { font-family: system-ui, sans-serif; font-size: 13px; color: #8b98a2; }
      #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #2a343b; overflow: hidden; }
      #splash .bar i { display: block; width: 40%; height: 100%; background: #f2a900; animation: splash 1.1s ease-in-out infinite; }
      @keyframes splash { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Loading COAL DRISHTI">
        <svg width="72" height="72" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#151B20" stroke="#3A4650"/><g fill="none" stroke="#F2A900"><path d="M3 16c4.5-6 9-8.5 13-8.5s8.5 2.5 13 8.5c-4.5 6-9 8.5-13 8.5S7.5 22 3 16Z" stroke-width="1.5" stroke-linejoin="round"/><circle cx="16" cy="16" r="5.5" stroke-width="1" opacity=".55"/><circle cx="16.4" cy="16.4" r="3.6" stroke-width="1" opacity=".8"/></g><circle cx="16.8" cy="16.8" r="1.7" fill="#F2A900"/></svg>
        <div class="name">COAL DRISHTI</div>
        <div class="bar"><i></i></div>
        <div class="sub">From Mine Data to Verified Action</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
